services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pet_agent
      POSTGRES_USER: pet_agent
      POSTGRES_PASSWORD: pet_agent_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ../apps/server
    environment:
      PET_AGENT_DATABASE_URL: postgresql+asyncpg://pet_agent:pet_agent_dev@postgres:5432/pet_agent
      PET_AGENT_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:

